[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyforge-agent"
version = "0.3.0"
description = "A small, auditable coding agent built without agent frameworks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Student"}]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
demo = ["PySide6>=6.7,<7", "Pillow>=10,<12", "edge-tts>=7,<8"]

[project.scripts]
tinyforge = "tinyforge.cli:main"
tinyforge-gui = "tinyforge.gui:main"

[tool.setuptools.packages.find]
include = ["tinyforge*"]
